name: AniNextUp safe dry-run validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python -m py_compile scripts/auto_publish_news.py
      - name: Offline safety regression tests
        run: python -m unittest discover -s tests -p test_publisher_safety.py -v
      - name: Check existing covers
        shell: python
        run: |
          from pathlib import Path
          for path in ['assets/images/covers/firefly-wedding.jpg','assets/images/covers/sasaki-and-peeps-season-2.jpg']:
              p=Path(path)
              assert p.is_file() and p.stat().st_size > 1000, f'Missing/empty cover: {path}'
      - name: Verify production remains gated and covers are committed
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/auto-publish-news.yml').read_text()
          required = [
              "ANINEXTUP_ENABLE_PUBLICATION == 'true'",
              "git add articles/ assets/images/news/ assets/data.js sitemap.xml",
              "Article cover missing from repository",
              "Invalid or empty article cover",
              "Article missing matching social cover metadata",
          ]
          for check in required:
              assert check in workflow, f'Missing production safeguard: {check}'
          print('PASS: publication disabled by default and image commit/validation configured')
      - name: Test official feeds without writing
        env:
          ANINEXTUP_DRY_RUN: '1'
          ANINEXTUP_OFFICIAL_FEEDS: https://cr-news-api-service.prd.crunchyrollsvc.com/v1/en-US/rss
        run: python scripts/auto_publish_news.py
      - name: Confirm no tracked or untracked content changes
        shell: bash
        run: |
          test -z "$(git status --porcelain -- articles/ assets/data.js sitemap.xml assets/images/news/)"
          echo 'PASS: no article, catalog, sitemap or cover modified'
