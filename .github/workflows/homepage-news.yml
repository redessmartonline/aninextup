name: Sync new articles to homepage
on:
  push:
    branches: [main]
    paths:
      - 'articles/**.html'
      - 'scripts/sync_homepage_news.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Add published articles to homepage feed
        run: python3 scripts/sync_homepage_news.py
      - name: Commit homepage feed updates
        run: |
          if ! git diff --quiet -- assets/data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data.js
            git commit -m "Automatically add newly published articles to homepage"
            git push
          fi
