name: Mirror rendered site images locally

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-site-images.yml'
      - 'scripts/mirror_site_images.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-site-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image validation tools
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Mirror and validate every rendered image
        run: python scripts/mirror_site_images.py
      - id: commit
        name: Commit local images and rewritten references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Host rendered site images on AniNextUp"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the updated site assets
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare-worker.yml --ref main
