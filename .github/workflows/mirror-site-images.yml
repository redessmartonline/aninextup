name: Mirror rendered site images locally

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-site-images.yml'
      - 'scripts/mirror_site_images.py'
      - 'articles/**'
      - 'assets/data.js'

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-site-images
  cancel-in-progress: false

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install image validation tools
        run: python -m pip install --disable-pip-version-check Pillow
      - id: commit
        name: Mirror images and commit from the latest branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # This is an ephemeral generated-output checkout.
            # Rebuild from current main after a competing workflow advances it.
            git fetch origin main
            git reset --hard origin/main
            python scripts/mirror_site_images.py
            git add -A
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Host rendered site images on AniNextUp"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "Image mirroring could not publish after three branch-refresh attempts."
          exit 1
      - name: Deploy the updated site assets
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare-worker.yml --ref main
