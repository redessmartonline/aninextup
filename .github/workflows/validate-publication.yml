name: Validate AniNextUp publication

on:
  workflow_run:
    workflows: ["Auto-integrate AniNextUp articles"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'assets/data.js'
      - 'sitemap.xml'
      - '.github/workflows/validate-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate central release index
        run: node --check assets/data.js

      - name: Validate sitemap XML
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          ET.parse("sitemap.xml")
          print("sitemap.xml is valid XML")

      - name: Validate article references and SEO
        shell: python
        run: |
          from pathlib import Path
          import html as htmlmod, json, re, sys, xml.etree.ElementTree as ET

          data = Path("assets/data.js").read_text(encoding="utf-8")
          errors = []

          refs = sorted(set(re.findall(r'article:"(articles/[^"]+\.html)"', data)))
          for ref in refs:
              if not Path(ref).is_file():
                  errors.append(f"data.js references missing article: {ref}")

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap_urls = {
              (node.text or "").strip()
              for node in root.findall("sm:url/sm:loc", ns)
          }

          # Every canonical, indexable root HTML page must also be discoverable in the sitemap.
          for p in sorted(Path(".").glob("*.html")):
              if p.name == "404.html":
                  continue
              html = p.read_text(encoding="utf-8")
              if 'name="robots" content="noindex' in html.lower():
                  continue
              canonical = re.search(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"', html, re.I)
              if canonical and canonical.group(1) not in sitemap_urls:
                  errors.append(f"{p}: canonical URL missing from sitemap.xml")

          for p in sorted(Path("articles").glob("*.html")):
              html = p.read_text(encoding="utf-8")
              url = f"https://aninextup.com/articles/{p.name}"
              required = {
                  "canonical": 'rel="canonical"',
                  "meta description": 'name="description"',
                  "Article schema": '"@type":"Article"',
                  "BreadcrumbList": '"@type":"BreadcrumbList"',
                  "H1": "<h1",
              }
              for label, needle in required.items():
                  if needle not in html:
                      errors.append(f"{p}: missing {label}")

              if url not in sitemap_urls:
                  errors.append(f"{p}: missing from sitemap.xml")

              if "lite-trailer" in html and html.count("lite-trailer") > 1:
                  errors.append(f"{p}: duplicate lite-trailer component")

              if "<iframe" in html.lower():
                  errors.append(f"{p}: legacy iframe found; use compact lite-trailer")

              meta_match = re.search(r'<script\s+type=["\']application/json["\']\s+id=["\']aninextup-index["\']>(.*?)</script>', html, re.I|re.S)
              if meta_match:
                  try:
                      meta = json.loads(htmlmod.unescape(meta_match.group(1)).strip())
                      article = p.as_posix()
                      entry_match = re.search(r'\{[^\n{}]*article:"' + re.escape(article) + r'"[^\n{}]*\},', data)
                      if not entry_match:
                          errors.append(f"{p}: aninextup-index metadata is missing from assets/data.js")
                      else:
                          entry = entry_match.group(0)
                          checks = {"image": meta.get("image"), "title": meta.get("title")}
                          if meta.get("kind", "guide") == "guide":
                              checks.update({"tag": meta.get("tag", "NEW"), "description": meta.get("description", "")})
                          else:
                              checks.update({
                                  "id": meta.get("id") or p.stem,
                                  "date": meta.get("date"),
                                  "platform": meta.get("platform", "TBA"),
                                  "category": meta.get("category", "Premiere"),
                                  "status": meta.get("status", "tba"),
                              })
                          for field, value in checks.items():
                              expected = "null" if value is None else json.dumps(str(value), ensure_ascii=False)
                              if f"{field}:{expected}" not in entry:
                                  errors.append(f"{p}: assets/data.js {field} is out of sync with aninextup-index")
                  except Exception as e:
                      errors.append(f"{p}: invalid aninextup-index metadata: {e}")

          if errors:
              print("\n".join(f"ERROR: {e}" for e in errors))
              sys.exit(1)

          print(f"Validated {len(refs)} indexed releases and all article HTML files.")
