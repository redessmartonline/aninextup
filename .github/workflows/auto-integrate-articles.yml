name: Auto-integrate AniNextUp articles

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aninextup-auto-integrate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync articles into sitemap and central index
        shell: python
        run: |
          from pathlib import Path
          import datetime, html as htmlmod, json, re, sys, xml.etree.ElementTree as ET
          sys.path.insert(0, str(Path.cwd()))
          from scripts.news_categories import classify_news_category

          today = datetime.date.today().isoformat()
          data_path = Path("assets/data.js")
          sitemap_path = Path("sitemap.xml")
          data = data_path.read_text(encoding="utf-8")

          # Optional machine-readable metadata embedded in a new article:
          # <script type="application/json" id="aninextup-index">{"kind":"anime",...}</script>
          for p in sorted(Path("articles").glob("*.html")):
              page = p.read_text(encoding="utf-8")
              original_page = page
              footer = '<footer><b>ANINEXTUP</b><p>Anime releases, streaming guides, calendars and news.</p><small>Release dates and availability can vary by region.</small><p><a href="../about">About</a> · <a href="../contact">Contact</a> · <a href="../privacy">Privacy</a> · <a href="../terms">Terms</a></p></footer>'
              # Collapse all legacy duplicates and append one canonical footer at the end.
              page = re.sub(r"<footer\b[^>]*>.*?</footer\s*>", "", page, flags=re.I|re.S)
              if "</body>" in page:
                  page = page.replace("</body>", footer + "\n</body>", 1)
              else:
                  page += "\n" + footer + "\n"
              # Move post-recommendation content above Related releases.
              related = re.search(r'(<section\\b[^>]*class="[^"]*\\brelated-releases\\b[^"]*"[^>]*>.*?</section>)', page, re.I|re.S)
              closing_article = page.lower().find("</article>", related.end()) if related else -1
              if related and closing_article >= 0:
                  trailing = page[related.end():closing_article]
                  if trailing.strip():
                      page = page[:related.start()] + trailing + related.group(1) + page[closing_article:]
              if page != original_page:
                  p.write_text(page, encoding="utf-8")
              app_script = re.compile(r'<script\s+src=["\'](?:\.\./)?assets/app\.js(?:\?[^"\']*)?["\']\s*></script>', re.I)
              app_script_tag = '<script src="../assets/app.js?v=20261017-footer-related-order"></script>'
              updated, replacements = app_script.subn(app_script_tag, page, count=1)
              if replacements == 0:
                  updated = page.replace("</body>", app_script_tag + "\n</body>", 1)
              if updated != page:
                  page = updated
                  p.write_text(page, encoding="utf-8")
              m = re.search(r'<script\s+type=["\']application/json["\']\s+id=["\']aninextup-index["\']>(.*?)</script>', page, re.I|re.S)
              if not m:
                  continue
              try:
                  meta = json.loads(htmlmod.unescape(m.group(1)).strip())
              except Exception as e:
                  raise SystemExit(f"{p}: invalid aninextup-index JSON: {e}")

              article = p.with_suffix("").as_posix()
              kind = meta.get("kind", "guide")
              category = meta.get("newsCategory")
              category_set = {"new-anime", "returning-series", "trailers-cast", "release-news"}
              if category not in category_set:
                  article_key = json.dumps(article)
                  existing_entry = re.search(
                      r'\{[^\n{}]*article:' + re.escape(article_key)
                      + r'[^\n{}]*newsCategory:["\']([^"\']+)["\'][^\n{}]*\},', data
                  )
                  category = existing_entry.group(1) if existing_entry and existing_entry.group(1) in category_set else None
              if category not in category_set:
                  category = classify_news_category(page, kind=kind)
              if category:
                  meta["newsCategory"] = category
              else:
                  meta.pop("newsCategory", None)
              updated_meta = json.dumps(meta, ensure_ascii=False, separators=(",", ":"))
              if updated_meta != m.group(1):
                  page = page[:m.start(1)] + updated_meta + page[m.end(1):]
                  p.write_text(page, encoding="utf-8")

              def js(v):
                  if v is None: return "null"
                  return json.dumps(str(v), ensure_ascii=False)

              image = meta.get("image")
              title = meta.get("title")
              if not image or not title:
                  raise SystemExit(f"{p}: aninextup-index requires image and title")

              if kind == "anime":
                  item_id = meta.get("id") or p.stem
                  date = meta.get("date")
                  date_label = meta.get("dateLabel")
                  platform = meta.get("platform", "TBA")
                  category = meta.get("category", "Premiere")
                  status = meta.get("status", "tba")
                  fields = [f'id:{js(item_id)}', f'image:{js(image)}', f'title:{js(title)}', f'date:{js(date)}']
                  if date_label: fields.append(f'dateLabel:{js(date_label)}')
                  fields += [f'platform:{js(platform)}', f'article:{js(article)}', f'category:{js(category)}', f'status:{js(status)}']
                  if meta.get("newsCategory"): fields.append(f'newsCategory:{js(meta["newsCategory"])}')
                  line = "{" + ",".join(fields) + "},"
                  pattern = re.compile(r'\{[^\n{}]*article:' + re.escape(js(article)) + r'[^\n{}]*\},')
                  if pattern.search(data):
                      data = pattern.sub(line, data, count=1)
                  else:
                      data = data.replace("anime:[\n", "anime:[\n" + line + "\n", 1)
              else:
                  tag = meta.get("tag", "NEW")
                  desc = meta.get("description", "")
                  fields = [
                      f'image:{js(image)}', f'title:{js(title)}', f'tag:{js(tag)}',
                      f'article:{js(article)}', f'description:{js(desc)}'
                  ]
                  if meta.get("newsCategory"): fields.append(f'newsCategory:{js(meta["newsCategory"])}')
                  line = "{" + ",".join(fields) + "},"
                  pattern = re.compile(r'\{[^\n{}]*article:' + re.escape(js(article)) + r'[^\n{}]*\},')
                  if pattern.search(data):
                      data = pattern.sub(line, data, count=1)
                  else:
                      data = data.replace("guides:[\n", "guides:[\n" + line + "\n", 1)

          data = re.sub(r'updated:"\d{4}-\d{2}-\d{2}"', f'updated:"{today}"', data, count=1)
          data_path.write_text(data, encoding="utf-8")

          # Rebuild sitemap article coverage without duplicates.
          raw = sitemap_path.read_text(encoding="utf-8").replace("\\n", "\n")
          root = ET.fromstring(raw)
          ns = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", ns)
          existing = set()
          for u in root.findall(f"{{{ns}}}url"):
              loc = u.find(f"{{{ns}}}loc")
              if loc is not None and loc.text:
                  existing.add(loc.text.strip())

          for p in sorted(Path("articles").glob("*.html")):
              url = f"https://aninextup.com/articles/{p.stem}"
              if url in existing:
                  continue
              node = ET.SubElement(root, f"{{{ns}}}url")
              ET.SubElement(node, f"{{{ns}}}loc").text = url
              ET.SubElement(node, f"{{{ns}}}lastmod").text = today
              existing.add(url)

          ET.indent(root, space="  ")
          sitemap_path.write_text('<?xml version="1.0" encoding="UTF-8"?>\n' + ET.tostring(root, encoding="unicode") + "\n", encoding="utf-8")

      - name: Validate generated files
        run: |
          node --check assets/data.js
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("sitemap.xml")
          print("sitemap.xml valid")
          PY

      - name: Verify News classification
        run: python tests/test_news_categories.py

      - name: Commit automatic integration
        run: |
          if git diff --quiet -- assets/data.js sitemap.xml articles; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js sitemap.xml articles
          git commit -m "Auto-integrate AniNextUp article"

          # main can advance while this workflow is validating/generating files.
          # Rebase onto the latest remote state before pushing; retry once on a race.
          for attempt in 1 2; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Automatic integration rebase failed on attempt $attempt."
              if [ "$attempt" -eq 2 ]; then exit 1; fi
              sleep 3
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push attempt $attempt; retrying with fresh remote state."
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 3
          done
