name: AniNextUp public quality audit
# Disabled at owner's request: no automatic triggers and audit job is skipped.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public URLs, images, trailers, and duplicates
        run: python scripts/audit_public.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aninextup-public-audit
          path: audit-results.json
          if-no-files-found: warn
