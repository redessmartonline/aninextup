name: Unify header styles across pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/unify_header_styles.py'
      - '.github/workflows/unify-header-styles.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/unify_header_styles.py
            git add -- '*.html'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Apply uniform header stylesheet across all pages"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
