name: Deploy AniNextUp Worker

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "assets/**"
      - "_headers"
      - "_redirects"
      - "robots.txt"
      - "sitemap.xml"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Check Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing."
            missing=1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is missing."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
