name: Deploy AniNextUp Worker

on:
  # Refresh This Week and Calendar daily at 7 a.m. in Santo Domingo.
  schedule:
    - cron: '0 11 * * *'
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "assets/**"
      - "src/**"
      - "db/**"
      - "scripts/optimize_public_covers.py"
      - "tests/test_lossless_covers.py"
      - "scripts/check_worker_bundle.py"
      - "tests/test_worker_bundle.py"
      - "scripts/prepare_newsletter_db.mjs"
      - "scripts/test_newsletter_live.mjs"
      - "scripts/test_comments_live.mjs"
      - "scripts/build_article_community.py"
      - "scripts/build_newsletter_popup.py"
      - "scripts/build_latest_news.py"
      - "scripts/editorial_dates.py"
      - "scripts/build_search_index.py"
      - "tests/test_search_index.py"
      - "scripts/build_watch_catalog.js"
      - "scripts/build_genres.py"
      - "tests/test_genres.py"
      - "scripts/open_external_links.py"
      - "scripts/install_google_ads_tag.py"
      - "scripts/google-ads-tag.js"
      - "tests/test_google_ads_tag.cjs"
      - "scripts/check_publication_media.py"
      - "scripts/prepare_public_media.py"
      - "scripts/prepare_google_cmp.py"
      - "scripts/build_public_article_covers.py"
      - "scripts/build_related_releases.py"
      - "scripts/draw_editorial_cover.py"
      - "scripts/cover-artwork/**"
      - "scripts/validate_publication.py"
      - "scripts/validate_video_schema.py"
      - "tests/test_publication_media.py"
      - "editorial/reviews/**"
      - "scripts/prerender_discovery.js"
      - "editorial/genre-tags.json"
      - "editorial/cover-provenance.json"
      - "scripts/build_calendar.js"
      - "tests/calendar-expanded.test.cjs"
      - "tests/test_weekly_episode_expiry.cjs"
      - "tests/test_article_broadcasts.cjs"
      - "scripts/build_popular_news.py"
      - "scripts/standardize_article_bylines.py"
      - "_headers"
      - "_redirects"
      - "robots.txt"
      - "sitemap.xml"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize production publishes so an older job cannot replace a newer release.
concurrency:
  group: aninextup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce editorial media review before deployment
        run: |
          python -m unittest discover -s tests -p test_worker_bundle.py
          python -m unittest discover -s tests -p test_publication_media.py
          python scripts/check_publication_media.py

      - name: Check Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing."
            missing=1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is missing."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Standardize article authorship and original publication dates
        run: python scripts/standardize_article_bylines.py

      - name: Install sharing and comments on published articles
        run: |
          python scripts/build_article_community.py
          python scripts/build_article_community.py --check

      - name: Build and validate current article search index
        run: |
          python scripts/build_search_index.py
          python -m unittest discover -s tests -p test_search_index.py

      - name: Build confirmed streaming platform catalog
        run: node scripts/build_watch_catalog.js

      - name: Generate publication-ordered homepage and news feed
        run: python scripts/build_latest_news.py

      - name: Render verified Popular News snapshot
        run: python scripts/build_popular_news.py

      - name: Refresh crawlable discovery schedules
        run: node scripts/prerender_discovery.js

      - name: Build genre directory and static site navigation
        run: |
          python scripts/build_genres.py
          python -m unittest discover -s tests -p test_genres.py

      - name: Install newsletter entry popup
        run: python scripts/build_newsletter_popup.py

      - name: Open external links in new tabs
        run: |
          python scripts/open_external_links.py
          python scripts/open_external_links.py --check

      - name: Install Google Ads behind targeting consent
        run: |
          python scripts/install_google_ads_tag.py
          node tests/test_google_ads_tag.cjs
          python -m unittest discover -s tests -p test_analytics_tag.py

      - name: Verify homepage first render matches latest publications
        run: |
          node tests/test_homepage_first_render.cjs
          node tests/test_verified_broadcasts.cjs
          node tests/test_weekly_episode_expiry.cjs
          node tests/test_article_broadcasts.cjs

      - name: Set up Node for newsletter validation
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify newsletter flows
        run: |
          node tests/newsletter.test.mjs
          node tests/comments.test.mjs
          node tests/calendar-expanded.test.cjs

      - name: Prepare newsletter database
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare_newsletter_db.mjs

      # Pass the optional secret to the final deployment without activating an
      # intermediate version. Keep the file outside the public asset directory.
      - name: Prepare newsletter secret for the final deployment
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python - <<'PYSECRET'
          import json, os
          from pathlib import Path
          secrets = {}
          if os.environ.get('RESEND_API_KEY'):
              secrets['RESEND_API_KEY'] = os.environ['RESEND_API_KEY']
          path = Path(os.environ['RUNNER_TEMP']) / 'aninextup-deploy-secrets.json'
          path.write_text(json.dumps(secrets), encoding='utf-8')
          path.chmod(0o600)
          PYSECRET

      - name: Prepare Google consent and original cover artwork
        run: |
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s tests -p test_lossless_covers.py
          python scripts/build_public_article_covers.py
          python scripts/prepare_public_media.py
          python scripts/optimize_public_covers.py
          python scripts/prepare_google_cmp.py
          python scripts/audit_adsense_readiness.py
          python scripts/check_worker_bundle.py

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file ${{ runner.temp }}/aninextup-deploy-secrets.json

      - name: Verify production serves the deployed content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        shell: bash
        run: |
          production_matches() {
            curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/assets/latest-news.json?deploy=$GITHUB_RUN_ID-$(date +%s%N)" \
              | cmp -s assets/latest-news.json - || return 1
            local live_home live_style cover_url
            live_home=$(curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/?deploy=$GITHUB_RUN_ID-$(date +%s%N)") || return 1
            [[ "$live_home" == *data-aninextup-cmp* ]] || return 1
            live_style=$(grep -oE '/assets/style\.css\?v=[a-z0-9]+' index.html | sed -n '1p')
            [[ -n "$live_style" ]] || return 1
            [[ "$live_home" == *"href=\"$live_style\""* && "$live_home" == *'id="more-anime-news"'* ]] || return 1
            live_home=${live_home#*id=\"more-anime-news\"}
            [[ "$live_home" == *data-home-more* ]] || return 1
            live_home=${live_home#*data-home-more}
            cover_url=$(grep -oE '/assets/article-covers/[a-z0-9-]+\.png' <<< "${live_home%%</section>*}" | sed -n '1p') || return 1
            [[ -n "$cover_url" && -f ".${cover_url}" ]] || return 1
            curl --fail --silent --show-error --max-time 15 "https://aninextup.com${cover_url}" \
              | cmp -s ".${cover_url}" - || return 1
            curl --fail --silent --show-error --max-time 15 "https://aninextup.com${live_style}" \
              | cmp -s assets/style.css - || return 1
            curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/articles/orochi-seventh-echoes-pilot-where-to-watch?deploy=$GITHUB_RUN_ID-$(date +%s%N)" \
              | grep -F 'article-original-cover' >/dev/null || return 1
            curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/assets/article-covers/a-certain-dark-item-release-date.png" \
              | cmp -s assets/article-covers/a-certain-dark-item-release-date.png - || return 1
            curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/assets/article-covers/dark-summoner-omake-shorts-watch-order.png" \
              | cmp -s assets/article-covers/dark-summoner-omake-shorts-watch-order.png - || return 1
            local cover_file slug article asset
            for cover_file in assets/article-covers/*-editorial.png; do
              [[ -f "$cover_file" ]] || continue
              asset="/${cover_file}"
              slug=${cover_file##*/}
              slug=${slug%-editorial.png}
              curl --fail --silent --show-error --max-time 15 "https://aninextup.com${asset}" \
                | cmp -s "$cover_file" - || return 1
              article=$(curl --fail --silent --show-error --max-time 15 \
                "https://aninextup.com/articles/${slug}?deploy=$GITHUB_RUN_ID-$(date +%s%N)") || return 1
              [[ "$article" == *"src=\"$asset\" width=\"1200\" height=\"630\""* &&
                 "$article" == *"property=\"og:image\" content=\"https://aninextup.com$asset\""* &&
                 "$article" == *"name=\"twitter:image\" content=\"https://aninextup.com$asset\""* &&
                 ( "$article" == *"\"image\":\"https://aninextup.com$asset\""* ||
                   "$article" == *"\"image\":[\"https://aninextup.com$asset\"]"* ) ]] || return 1
            done
          }
          version=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -nE 's/.*Current Version ID: ([[:xdigit:]-]{36}).*/\1/p' | tail -1)
          if [[ ! "$version" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]; then
            echo "::error::Could not identify the version just built."
            exit 1
          fi
          npx --yes wrangler@4 versions deploy "${version}@100%" --yes --message "Activate the verified production build"
          for attempt in 1 2 3 4 5 6; do
            if production_matches; then exit 0; fi
            sleep 5
          done
          echo "::error::Production has not served the expected feed, consent tag, cover images or homepage styles."
          exit 1

      - name: Verify live immediate newsletter signup and unsubscribe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/test_newsletter_live.mjs

      - name: Verify live pending comments remain private
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/test_comments_live.mjs
