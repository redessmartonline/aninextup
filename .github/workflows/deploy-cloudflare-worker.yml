name: Deploy AniNextUp Worker

on:
  # Refresh This Week and Calendar daily at 7 a.m. in Santo Domingo.
  schedule:
    - cron: '0 11 * * *'
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "assets/**"
      - "src/**"
      - "db/**"
      - "scripts/prepare_newsletter_db.mjs"
      - "scripts/test_newsletter_live.mjs"
      - "scripts/test_comments_live.mjs"
      - "scripts/build_article_community.py"
      - "scripts/build_newsletter_popup.py"
      - "scripts/build_latest_news.py"
      - "scripts/editorial_dates.py"
      - "scripts/build_search_index.py"
      - "tests/test_search_index.py"
      - "scripts/build_watch_catalog.js"
      - "scripts/build_genres.py"
      - "tests/test_genres.py"
      - "scripts/open_external_links.py"
      - "scripts/install_google_ads_tag.py"
      - "scripts/google-ads-tag.js"
      - "tests/test_google_ads_tag.cjs"
      - "scripts/check_publication_media.py"
      - "scripts/validate_publication.py"
      - "scripts/validate_video_schema.py"
      - "tests/test_publication_media.py"
      - "editorial/reviews/**"
      - "scripts/prerender_discovery.js"
      - "editorial/genre-tags.json"
      - "scripts/build_calendar.js"
      - "tests/calendar-expanded.test.cjs"
      - "tests/test_weekly_episode_expiry.cjs"
      - "tests/test_article_broadcasts.cjs"
      - "scripts/build_popular_news.py"
      - "scripts/standardize_article_bylines.py"
      - "_headers"
      - "_redirects"
      - "robots.txt"
      - "sitemap.xml"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize production publishes so an older job cannot replace a newer release.
concurrency:
  group: aninextup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce editorial media review before deployment
        run: |
          python -m unittest discover -s tests -p test_publication_media.py
          python scripts/check_publication_media.py

      - name: Check Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing."
            missing=1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is missing."
            missing=1
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Standardize article authorship and original publication dates
        run: python scripts/standardize_article_bylines.py

      - name: Install sharing and comments on published articles
        run: |
          python scripts/build_article_community.py
          python scripts/build_article_community.py --check

      - name: Build and validate current article search index
        run: |
          python scripts/build_search_index.py
          python -m unittest discover -s tests -p test_search_index.py

      - name: Build confirmed streaming platform catalog
        run: node scripts/build_watch_catalog.js

      - name: Generate publication-ordered homepage and news feed
        run: python scripts/build_latest_news.py

      - name: Render verified Popular News snapshot
        run: python scripts/build_popular_news.py

      - name: Refresh crawlable discovery schedules
        run: node scripts/prerender_discovery.js

      - name: Build genre directory and static site navigation
        run: |
          python scripts/build_genres.py
          python -m unittest discover -s tests -p test_genres.py

      - name: Install newsletter entry popup
        run: python scripts/build_newsletter_popup.py

      - name: Open external links in new tabs
        run: |
          python scripts/open_external_links.py
          python scripts/open_external_links.py --check

      - name: Install Google Ads behind targeting consent
        run: |
          python scripts/install_google_ads_tag.py
          node tests/test_google_ads_tag.cjs
          python -m unittest discover -s tests -p test_analytics_tag.py

      - name: Verify homepage first render matches latest publications
        run: |
          node tests/test_homepage_first_render.cjs
          node tests/test_verified_broadcasts.cjs
          node tests/test_weekly_episode_expiry.cjs
          node tests/test_article_broadcasts.cjs

      - name: Set up Node for newsletter validation
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify newsletter flows
        run: |
          node tests/newsletter.test.mjs
          node tests/comments.test.mjs
          node tests/calendar-expanded.test.cjs

      - name: Prepare newsletter database
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare_newsletter_db.mjs

      # Updating a Worker secret deploys a version. Publish the built assets last.
      - name: Install newsletter delivery secret when supplied
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
          else
            echo "Newsletter delivery awaits the RESEND_API_KEY repository secret."
          fi

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production serves the deployed content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        shell: bash
        run: |
          production_matches() {
            curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/assets/latest-news.json?deploy=$GITHUB_RUN_ID-$(date +%s%N)" \
              | cmp -s assets/latest-news.json - || return 1
            curl --fail --silent --show-error --max-time 15 \
              "https://aninextup.com/?deploy=$GITHUB_RUN_ID-$(date +%s%N)" \
              | grep -F 'AW-18543289744/bL0sCNDmh7UdEJDLkIpF' >/dev/null
          }
          if production_matches; then exit 0; fi
          version=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed -nE 's/.*Current Version ID: ([[:xdigit:]-]{36}).*/\1/p' | tail -1)
          if [[ ! "$version" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]; then
            echo "::error::Could not identify the version just built."
            exit 1
          fi
          npx --yes wrangler@4 versions deploy "${version}@100%" --yes --message "Activate the verified production build"
          for attempt in 1 2 3 4 5 6; do
            if production_matches; then exit 0; fi
            sleep 5
          done
          echo "::error::Production has not served the expected news feed and Google Ads consent block."
          exit 1

      - name: Verify live immediate newsletter signup and unsubscribe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/test_newsletter_live.mjs

      - name: Verify live pending comments remain private
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/test_comments_live.mjs
