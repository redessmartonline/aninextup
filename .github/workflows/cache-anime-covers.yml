name: Cache anime covers locally
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cache-anime-covers.yml']
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified anime covers
        shell: bash
        run: |
          mkdir -p assets/images/covers
          get(){ echo "Fetching $1"; curl -fL --retry 2 --connect-timeout 20 -A "Mozilla/5.0" "$2" -o "assets/images/covers/$1" || rm -f "assets/images/covers/$1"; }
          pageget(){ echo "Finding image for $1"; html=$(curl -fL --retry 2 -A "Mozilla/5.0" "$2" || true); url=$(printf '%s' "$html" | grep -oP '<meta[^>]+(?:property|name)="og:image"[^>]+content="\K[^"]+' | head -1); [ -n "$url" ] && get "$1" "$url" || true; }
          pageget im-looking-for-a-zombie.jpg "https://www.crunchyroll.com/news/announcements/2026/10/2/im-looking-for-a-zombie-anime-english-dub-release-date-cast-crew"
          get tale-secret-saint.webp "https://i0.wp.com/finalweapon.net/wp-content/uploads/2026/03/A-Tale-of-the-Secret-Saint-anime-series.webp?resize=1068%2C601&ssl=1"
          get romelia-war-chronicle.png "https://i0.wp.com/anitrendz.net/news/wp-content/uploads/2026/09/EN_logo_Romelia-War-Chronicle_Main-Visual_2000x2831.png?resize=700%2C991&ssl=1"
          pageget aoashi-season-2.jpg "https://www.crunchyroll.com/es/news/latest/2026/6/26/aoashi-temporada-2-parte-1-imagen-temas-musicales"
          get reincarnated-goblin.jpeg "https://i0.wp.com/anitrendz.net/news/wp-content/uploads/2026/09/So-Whats-Wrong-with-Getting-Reborn-as-a-Goblin-new-visual.jpeg?resize=700%2C988&ssl=1"
          get laid-off-cheat-granting-mage.jpg "https://us.oricon-group.com/upimg/detail/8000/8809/img660/The-Laid-Off-Cheat-Granting-Mage-1.jpg"
          get sasaki-and-peeps-season-2.jpg "https://sasapi-anime.com/images/special/visual/key_visual05.jpg"
          get detective-is-already-dead-season-2.jpg "https://tanmoshi-anime.jp/Season2/core_sys/images/main/home/kv02.jpg"
          pageget iceblade-sorcerer-ii.jpg "https://www.crunchyroll.com/news/latest/2026/8/20/the-iceblade-sorcerer-shall-rule-the-world-season-2-anime-october-8-release-date-key-visual-theme-songs"
          pageget ace-of-diamond-second-season.jpg "https://www.crunchyroll.com/news/latest/2026/4/26/ace-of-the-diamond-act-ii-second-season-anime-unveils-new-visual"
          pageget ramparts-of-ice-season-2.jpg "https://about.netflix.com/en/news/the-ramparts-of-ice-season-2"
          get returners-magic-s2.jpeg "https://i0.wp.com/anitrendz.net/news/wp-content/uploads/2026/09/a-returners-magic-should-be-special-season-2-new-visual-1-e1789495197357.jpeg?resize=1200%2C676&ssl=1"
          pageget magic-knight-rayearth.jpg "https://www.crunchyroll.com/news/latest/2026/9/20/new-magic-knight-rayearth-anime-theme-songs-previewed-in-new-trailer"
          get firefly-wedding.jpg "https://i0.wp.com/anitrendz.net/news/wp-content/uploads/2026/09/Firefly-Wedding-key-visual-1-e1788687986414.jpg?fit=850%2C480&ssl=1"
          get my-happy-marriage-specials.jpg "https://www.whats-on-netflix.com/wp-content/uploads/2026/08/new-my-happy-marriage-specials-coming-to-netflix.jpg"
      - name: Point site to local covers
        shell: python
        run: |
          from pathlib import Path
          p=Path("assets/data.js")
          s=p.read_text()
          mapping={
          "im-looking-for-a-zombie":"assets/images/covers/im-looking-for-a-zombie.jpg",
          "tale-secret-saint":"assets/images/covers/tale-secret-saint.webp",
          "romelia-war-chronicle":"assets/images/covers/romelia-war-chronicle.png",
          "aoashi-season-2":"assets/images/covers/aoashi-season-2.jpg",
          "reincarnated-goblin":"assets/images/covers/reincarnated-goblin.jpeg",
          "laid-off-cheat-granting-mage":"assets/images/covers/laid-off-cheat-granting-mage.jpg",
          "sasaki-and-peeps-season-2":"assets/images/covers/sasaki-and-peeps-season-2.jpg",
          "detective-is-already-dead-season-2":"assets/images/covers/detective-is-already-dead-season-2.jpg",
          "iceblade-sorcerer-ii":"assets/images/covers/iceblade-sorcerer-ii.jpg",
          "ace-of-diamond-second-season":"assets/images/covers/ace-of-diamond-second-season.jpg",
          "ramparts-of-ice-season-2":"assets/images/covers/ramparts-of-ice-season-2.jpg",
          "returners-magic-s2":"assets/images/covers/returners-magic-s2.jpeg",
          "magic-knight-rayearth":"assets/images/covers/magic-knight-rayearth.jpg",
          "firefly-wedding":"assets/images/covers/firefly-wedding.jpg",
          "my-happy-marriage-specials":"assets/images/covers/my-happy-marriage-specials.jpg"}
          import re
          for k,v in mapping.items():
              if not Path(v).exists(): continue
              s=re.sub(r'(id:"'+re.escape(k)+r'",image:)"[^"]+"',r'\1"'+v+'"',s)
          p.write_text(s)
      - name: Commit local covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/covers assets/data.js
          git commit -m "Cache anime covers locally" || exit 0
          git push
