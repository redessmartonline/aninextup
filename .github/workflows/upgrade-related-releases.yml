name: Upgrade related releases to three
on:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_publish_news.py'
      - 'scripts/upgrade_related_releases.py'
      - '.github/workflows/upgrade-related-releases.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update existing article cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/upgrade_related_releases.py
            python - <<'PY'
            import pathlib, re
            count = 0
            for path in pathlib.Path('articles').glob('*.html'):
                source = path.read_text(encoding='utf-8')
                section = re.search(r'<section class="related-releases"[^>]*>.*?<h2[^>]*>Related releases</h2>.*?</section>', source, re.S)
                if section:
                    cards = len(re.findall(r'class="mini related-card"', section.group()))
                    if cards != 3:
                        raise SystemExit(f'{path}: expected 3 related releases, got {cards}')
                    count += 1
            print(f'Validated {count} article sections with 3 cards')
            PY
            git add articles/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Upgrade article related releases to three cards"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
