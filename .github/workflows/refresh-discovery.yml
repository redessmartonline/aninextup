name: Refresh AniNextUp discovery HTML
on:
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data.js'
      - 'assets/app.js'
      - 'assets/search-aliases.json'
      - 'scripts/build_search_index.py'
      - 'tests/test_search_progressive.cjs'
      - 'tests/test_search_index.py'
      - 'assets/release-model.js'
      - 'scripts/prerender_discovery.js'
      - 'scripts/complete_article_navigation.py'
      - 'articles/**'
      - '.github/workflows/refresh-discovery.yml'
permissions:
  contents: write
concurrency:
  group: aninextup-discovery-html
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh and save discovery HTML from current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_search_index.py
            node scripts/prerender_discovery.js
            python scripts/complete_article_navigation.py
            node tests/test_discovery.js
            node tests/test_search_progressive.cjs
            python -m unittest discover -s tests -p test_search_index.py
            git diff --check
            git add -- '*.html' 'articles/*.html' 'assets/search-index.json'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh crawlable schedules and article navigation"
            if git push origin HEAD:main; then exit 0; fi
            echo "main advanced; regenerating discovery HTML (attempt $attempt)"
          done
          echo "Could not save discovery HTML after three attempts" >&2
          exit 1
