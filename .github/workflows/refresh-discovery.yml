name: Refresh AniNextUp discovery HTML
on:
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/data.js'
      - 'assets/release-model.js'
      - 'scripts/prerender_discovery.js'
      - 'scripts/complete_article_navigation.py'
      - 'articles/**'
      - '.github/workflows/refresh-discovery.yml'
permissions:
  contents: write
concurrency:
  group: aninextup-discovery-html
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh visible schedules and article navigation
        run: |
          node scripts/prerender_discovery.js
          python scripts/complete_article_navigation.py
          node tests/test_discovery.js
          git diff --check
      - name: Save refreshed HTML
        run: |
          git add -- '*.html' 'articles/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh crawlable schedules and article navigation"
          git pull --rebase origin main
          git push origin HEAD:main
