name: AniNextUp autonomous official-news publisher

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aninextup-autonomous-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Smoke test RSS parsing and editorial scoring
        shell: python
        run: |
          import datetime as dt
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("publisher", Path("scripts/auto_publish_news.py"))
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          now = dt.datetime.now(dt.timezone.utc)
          stamp = now.strftime("%a, %d %b %Y %H:%M:%S +0000")
          rss = ('<rss><channel><item><title>Official anime season trailer announced today</title>'
                 '<link>https://www.crunchyroll.com/news/official-test</link>'
                 '<pubDate>' + stamp + '</pubDate>'
                 '<description>' + 'Verified official information. ' * 10 + '</description>'
                 '</item></channel></rss>').encode()
          items = publisher.items_from_feed(rss)
          assert len(items) == 1, "RSS parsing failed"
          title, link, raw_date, desc = items[0]
          assert publisher.host_allowed(link), "Official source rejected"
          when = publisher.date_of(raw_date)
          assert when is not None, "RSS date parsing failed"
          parts = publisher.opportunity_score(when,title,desc,now)
          assert parts["intent"] == 20, "Keyword scoring failed"
          assert sum(parts.values()) >= 60, "Expected editorial candidate rejected"
          assert not publisher.host_allowed("https://evil.example/news"), "Unofficial source accepted"
          print("PASS: RSS, dates, source restrictions, editorial scoring")
      - name: Find verified official announcements
        env:
          ANINEXTUP_OFFICIAL_FEEDS: ${{ vars.ANINEXTUP_OFFICIAL_FEEDS }}
        run: |
          if [ -z "$ANINEXTUP_OFFICIAL_FEEDS" ]; then
            export ANINEXTUP_OFFICIAL_FEEDS=https://cr-news-api-service.prd.crunchyrollsvc.com/v1/en-US/rss
          fi
          python scripts/auto_publish_news.py
      - name: Validate and synchronize article changes
        shell: python
        run: |
          from pathlib import Path
          import datetime, html, json, re, subprocess
          import xml.etree.ElementTree as ET
          tracked = subprocess.check_output(['git','diff','--name-only','--','articles/'],text=True).splitlines()
          new = subprocess.check_output(['git','ls-files','--others','--exclude-standard','articles/'],text=True).splitlines()
          changed = sorted(set(tracked + new))
          if not changed:
              print('Sin cambios en la página en esta ejecución')
              raise SystemExit(0)
          if len(changed) != 1:
              raise SystemExit('Expected exactly one changed article')
          p = Path(changed[0])
          if p.suffix != '.html' or not p.is_file():
              raise SystemExit('Unexpected article path')
          body = p.read_text(encoding='utf-8')
          if not all(x in body for x in ('<h1','rel="canonical"','"@type":"Article"','"@type":"BreadcrumbList"')):
              raise SystemExit('Missing article SEO markup')
          match = re.search(r'<script type="application/json" id="aninextup-index">(.*?)</script>',body,re.S)
          if not match:
              raise SystemExit('Missing article index metadata')
          meta = json.loads(html.unescape(match.group(1)))
          data_path = Path('assets/data.js')
          data = data_path.read_text(encoding='utf-8')
          article = str(p).replace('\\','/')
          matches = re.findall(r'article\s*:\s*["\x27]' + re.escape(article) + r'["\x27]',data)
          if len(matches) > 1:
              raise SystemExit('Duplicate index entry')
          if not matches:
              def js(x): return json.dumps(str(x),ensure_ascii=False)
              entry = '{' + ','.join(''.join((k,':',js(meta[k]))) for k in ('image','title','tag')) + ',article:' + js(article) + ',description:' + js(meta['description']) + '},'
              if 'guides:[\n' not in data:
                  raise SystemExit('Missing guides array anchor')
              data = data.replace('guides:[\n','guides:[\n' + entry + '\n',1)
              data_path.write_text(data,encoding='utf-8')
          sitemap = Path('sitemap.xml')
          root = ET.parse(sitemap).getroot()
          ns = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          ET.register_namespace('',ns)
          url = 'https://aninextup.com/' + article
          entries = [el for el in root.findall(f'{{{ns}}}url') if (el.findtext(f'{{{ns}}}loc') or '').strip() == url]
          if len(entries) > 1:
              raise SystemExit('Duplicate sitemap URL')
          el = entries[0] if entries else ET.SubElement(root,f'{{{ns}}}url')
          loc = el.find(f'{{{ns}}}loc')
          if loc is None:
              loc = ET.SubElement(el,f'{{{ns}}}loc')
          loc.text = url
          mod = el.find(f'{{{ns}}}lastmod')
          if mod is None:
              mod = ET.SubElement(el,f'{{{ns}}}lastmod')
          mod.text = datetime.date.today().isoformat()
          ET.indent(root,space='  ')
          sitemap.write_text('<?xml version="1.0" encoding="UTF-8"?>\n' + ET.tostring(root,encoding='unicode') + '\n',encoding='utf-8')
          print('Synchronized',article,url)
      - name: Validate files
        run: |
          node --check assets/data.js
          python -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml')"
          git diff --check
      - name: Commit publication atomically
        run: |
          if [ -z "$(git status --porcelain -- articles/ assets/data.js sitemap.xml)" ]; then
            echo "No verified article to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ assets/data.js sitemap.xml
          git commit -m "Publish official-source AniNextUp news"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
