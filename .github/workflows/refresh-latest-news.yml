name: Refresh latest anime news
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/build_latest_news.py'
      - 'scripts/optimize_news_images.py'
  workflow_dispatch:
concurrency:
  group: refresh-aninextup-news-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize_news_images.py
      - run: python scripts/build_latest_news.py
      - name: Commit generated feed and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/latest-news.json
          git add -A assets/images/news/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-refresh latest anime news and homepage"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
