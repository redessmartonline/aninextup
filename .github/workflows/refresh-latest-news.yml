name: Refresh latest anime news
on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/build_latest_news.py'
      - 'scripts/optimize_news_images.py'
      - '.github/workflows/refresh-latest-news.yml'
  workflow_dispatch:
concurrency:
  group: refresh-aninextup-news-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate and commit current feed and homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Generated output must be rebuilt from the current branch after a race.
            # This checkout is an ephemeral Actions workspace, with no user edits.
            git fetch origin main
            git reset --hard origin/main
            python scripts/optimize_news_images.py
            python scripts/build_latest_news.py
            git add index.html assets/latest-news.json
            git add -A assets/images/news/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Auto-refresh latest anime news and homepage"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "main kept advancing; latest-news generation could not be committed."
          exit 1
