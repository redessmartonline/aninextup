name: Editorial source visual review
on:
  pull_request:
    branches: [main]
    paths: [articles/blue-box-season-2.html,articles/horror-collector-release-date.html,articles/witch-on-the-holy-night-movie.html,articles/detective-is-already-dead-season-2.html,articles/chitose-ramune-bottle-cour-2.html,articles/tank-chair-release-date.html,articles/dreamland-release-date.html, articles/pokemon-horizons-season-4-wonders-ahead.html, articles/votoms-gray-witch-part-1.html, articles/otome-heroines-fight-for-survival-anime.html, articles/demons-crest-release-date.html, articles/returners-magic-season-2.html, articles/love-live-hasunosora-release-date.html, articles/sasaki-and-peeps-season-2.html,articles/fledgling-demon-lords-starter-shop.html, assets/style.css, index.html, assets/app.js, assets/data.js, sitemap.xml, .github/workflows/editorial-source-visual.yml]
  push:
    branches: [editorial/blue-box-depth-20261024, editorial/tank-chair-guide-20261024, editorial/full-clearing-reader-guide-20261024, editorial/demons-crest-800-1000-october-25-2026, editorial/returners-magic-season-2-october-2026, editorial/love-live-hasunosora-october-2026, editorial/sasaki-and-peeps-800-1000-october-25-2026, editorial/manchuria-opium-squad-guide-20261024, editorial/my-happy-marriage-guide-20261024, editorial/fallen-vampire-guide-20261024, editorial/reincarnated-goblin-guide-20261024, editorial/suikoden-viewing-guide-20261024, editorial/ranma-season3-guide-20261024, editorial/votoms-gray-witch-guide-20261024, editorial/otome-survival-depth-20261024, editorial/dreamland-release-guide-20261024, editorial/pokemon-horizons-season4-depth-20261024, fix/more-news-pagination-mobile-20261025, fix/more-news-pagination-next-state-20261025]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render committed source with all external requests blocked
        run: |
          mkdir -p /tmp/editorial-evidence
          cat > /tmp/editorial-server.py <<'PY'
          import http.server
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  import os
                  route=self.path.split('?')[0]
                  if not os.path.exists('.'+route) and os.path.isfile('.'+route+'.html'):
                      self.path=route+'.html'
                  super().do_GET()
          http.server.ThreadingHTTPServer(('127.0.0.1',8000),Handler).serve_forever()
          PY
          python /tmp/editorial-server.py >/tmp/server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch();
            const report=[];
            const branch=process.env.GITHUB_HEAD_REF||process.env.GITHUB_REF_NAME;
            const article=branch.includes('fledgling-demon-lords-starter-shop')?'fledgling-demon-lords-starter-shop':branch.includes('sasaki-and-peeps-800-1000')?'sasaki-and-peeps-season-2':branch.includes('love-live-hasunosora')?'love-live-hasunosora-release-date':branch.includes('returners-magic-season-2')?'returners-magic-season-2':branch.includes('shangri-la-frontier-season-3')?'shangri-la-frontier-season-3-release-date':branch.includes('blue-box-depth')?'blue-box-season-2':branch.includes('horror-collector-guide-20261024')?'horror-collector-release-date':branch.includes('witch-holy-night-quality-20261024')?'witch-on-the-holy-night-movie':branch.includes('detective-season2-guide-20261024')?'detective-is-already-dead-season-2':branch.includes('chitose-cour2-value-20261024')?'chitose-ramune-bottle-cour-2':branch.includes('tank-chair-guide-20261024')?'tank-chair-release-date':branch.includes('dreamland-release-guide')?'dreamland-release-date':branch.includes('pokemon-horizons-season4')?'pokemon-horizons-season-4-wonders-ahead':branch.includes('otome-survival-depth')?'otome-heroines-fight-for-survival-anime':branch.includes('votoms-gray-witch')?'votoms-gray-witch-part-1':branch.includes('ranma-season3')?'ranma-season-3':branch.includes('suikoden-viewing')?'suikoden-anime':branch.includes('reincarnated-goblin')?'reincarnated-goblin':branch.includes('fallen-vampire')?'record-of-a-fallen-vampire-anime':branch.includes('my-happy-marriage')?'my-happy-marriage-special-episodes':branch.includes('manchuria')?'manchuria-opium-squad-anime':branch.includes('demons-crest')?'demons-crest-release-date':'full-clearing-another-world-zero-believers-premiere';
            for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const context=await browser.newContext({viewport:{width,height}});
              await context.route('**/*',route=>(new URL(route.request().url()).hostname==='127.0.0.1')?route.continue():route.abort());
              const page=await context.newPage();
              for(const slug of [article,'the-fable-season-2-january-2027']){
                await page.goto('http://127.0.0.1:8000/articles/'+slug,{waitUntil:'networkidle'});
                await page.locator('article.article').waitFor({state:'visible'});
                await page.evaluate(()=>window.scrollTo(0,0));
                await page.locator('article img').evaluateAll(async es=>{for(const i of es)i.loading='eager';await Promise.all(es.map(i=>i.decode().catch(()=>{})));});
                const imageURLs=await page.locator('article img').evaluateAll(es=>es.map(i=>i.src));
                const imageHTTP=[];
                for(const url of imageURLs){const response=await page.request.get(url);imageHTTP.push({url,status:response.status(),mime:response.headers()['content-type']});if(!response.ok()||!response.headers()['content-type']?.startsWith('image/'))throw Error('Invalid image '+url);}
                const relatedURLs=await page.locator('.related-releases a.mini').evaluateAll(es=>es.map(a=>a.href));
                for(const url of relatedURLs){const response=await page.request.get(url);if(!response.ok())throw Error('Broken related route '+url);}
                report.push({name,slug,imageHTTP,relatedURLs});
                await page.screenshot({path:'/tmp/editorial-evidence/'+name+'-'+slug+'.png',fullPage:true});
                report.push({name,slug,checks:await page.evaluate(()=>({h1:document.querySelector('h1')?.textContent,overflow:document.documentElement.scrollWidth>innerWidth,images:[...document.querySelectorAll('article img')].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0,width:i.naturalWidth,height:i.naturalHeight})),schemas:[...document.querySelectorAll('script[type="application/ld+json"]')].map(s=>JSON.parse(s.textContent)['@type'])}))});
              }
              await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
              for(const homeSlug of (branch.includes('-length')?['tank-chair-release-date','chitose-ramune-bottle-cour-2','detective-is-already-dead-season-2','dreamland-release-date']:[article])){
              let cards=page.locator('[data-home-more] > a[href="/articles/'+homeSlug+'"]');
              if(await cards.count()===0){const present=await page.locator('[data-home-more] > a[href]').evaluateAll(es=>es.map(a=>({href:a.getAttribute('href'),title:a.querySelector('h3')?.textContent})));throw Error('Missing exact More Anime News homepage card '+homeSlug+'; visible-source links: '+JSON.stringify(present.slice(0,30)));}
              const pageLabel=await page.locator('[data-home-more-pagination] .pages').innerText().catch(()=> 'Page 1 of 1');
              const pageCount=Number(pageLabel.match(/of\s+(\d+)/i)?.[1]||1);
              let foundPage=1;
              while(!(await cards.first().isVisible())&&foundPage<pageCount){
                foundPage++;
                await page.goto('http://127.0.0.1:8000/?more-news-page='+foundPage+'#more-anime-news',{waitUntil:'networkidle'});
                cards=page.locator('[data-home-more] > a[href="/articles/'+homeSlug+'"]');
              }
              if(!(await cards.first().isVisible()))throw Error('More Anime News card is not visible on any page '+homeSlug);
              for(let i=0;i<await cards.count();i++){await cards.nth(i).scrollIntoViewIfNeeded();await cards.nth(i).locator('img').evaluateAll(async es=>{for(const i of es)i.loading='eager';await Promise.all(es.map(i=>i.decode()));if(es.some(i=>!i.complete||i.naturalWidth===0))throw Error('Homepage card image failed');});await cards.nth(i).screenshot({path:'/tmp/editorial-evidence/'+name+'-home-card-'+homeSlug+'-'+i+'.png'});}
              report.push({name,homeSlug,foundPage,pageCount,homeCardCount:await cards.count(),homeCardHref:await cards.first().getAttribute('href'),homeCardTitle:await cards.first().locator('h3').innerText()});
              }
              await context.close();
            }
            if(branch.includes('pagination-')){
              const context=await browser.newContext({viewport:{width:390,height:844}});
              await context.route('**/*',route=>(new URL(route.request().url()).hostname==='127.0.0.1')?route.continue():route.abort());
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:8000/?more-news-page=1#more-anime-news',{waitUntil:'networkidle'});
              const nav=page.locator('[data-home-more-pagination]');
              await nav.waitFor({state:'visible'});
              await nav.scrollIntoViewIfNeeded();
              const checks=await nav.evaluate(el=>{
                const numbers=[...el.children].filter(x=>/^\d+$/.test(x.textContent.trim()));
                const ys=[...new Set(numbers.map(x=>Math.round(x.getBoundingClientRect().top)))];
                return {flexDirection:getComputedStyle(el).flexDirection,navWidth:el.clientWidth,navScrollWidth:el.scrollWidth,numberButtons:numbers.length,numberRows:ys.length,numberY:ys,viewport:innerWidth};
              });
              if(checks.flexDirection!=='row'||checks.navScrollWidth>checks.navWidth||checks.numberButtons!==9||checks.numberRows!==1)throw Error('Mobile More Anime News pagination layout failed: '+JSON.stringify(checks));
              for(let target=2;target<=9;target++){
                await nav.locator('a.nextpostslink').click();
                const label=await nav.locator('.pages').innerText();
                const numericControls=await nav.locator('a[data-more-news-page]:not(.previouspostslink):not(.nextpostslink),.current').count();
                if(label!=='Page '+target+' of 9'||numericControls!==9)throw Error('Next lost page links at target '+target+': '+label+' controls='+numericControls);
              }
              await nav.locator('a.previouspostslink').click();
              if(await nav.locator('.pages').innerText()!=='Page 8 of 9')throw Error('Previous navigation failed after Next sequence');
              await nav.locator('a[data-more-news-page="5"]').click();
              if(await nav.locator('.pages').innerText()!=='Page 5 of 9')throw Error('Direct page navigation failed');
              await nav.locator('a[data-more-news-page="1"]').click();
              if(await nav.locator('.pages').innerText()!=='Page 1 of 9')throw Error('Return to page one failed');
              report.push({name:'pagination-navigation',pageCount:9,nextTransitions:8,previous:8,directPage:5,returnPage:1});
              await page.screenshot({path:'/tmp/editorial-evidence/mobile-home-pagination.png'});
              report.push({name:'mobile-pagination',...checks});
              await context.close();
            }
            fs.writeFileSync('/tmp/editorial-evidence/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-source-visual-review
          path: /tmp/editorial-evidence
          retention-days: 7
