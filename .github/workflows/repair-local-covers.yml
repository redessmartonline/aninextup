name: Verify and repair local anime covers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-local-covers.yml'
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Verify both local images and fix only the JPEG extension
        shell: python
        run: |
          import io, json, pathlib, re
          from PIL import Image
          root=pathlib.Path('.')
          report={}
          saint_old=root/'assets/images/covers/tale-secret-saint.webp'
          saint_new=root/'assets/images/covers/tale-secret-saint.jpg'
          ao=root/'assets/images/covers/aoashi-season-2.jpg'
          source=root/'assets/data.js'
          content=source.read_text(encoding='utf-8')
          for ident, p in [('tale-secret-saint', saint_new if saint_new.exists() else saint_old), ('aoashi-season-2',ao)]:
              if not p.exists():
                  raise FileNotFoundError(f'Missing local cover: {p}')
              data=p.read_bytes()
              with Image.open(io.BytesIO(data)) as img:
                  report[ident]={'bytes':len(data),'format':img.format,'dimensions':list(img.size)}
                  img.verify()
          if report['tale-secret-saint']['format']!='JPEG':
              raise RuntimeError('Secret Saint image must be JPEG')
          if report['aoashi-season-2']['format'] not in ('JPEG','PNG','WEBP','AVIF'):
              raise RuntimeError('Aoashi image is not a supported image')
          oldref='assets/images/covers/tale-secret-saint.webp'
          newref='assets/images/covers/tale-secret-saint.jpg'
          if saint_old.exists():
              if saint_new.exists() and saint_new.read_bytes()!=saint_old.read_bytes():
                  raise RuntimeError('Both cover files exist with different contents')
              if not saint_new.exists():
                  saint_new.write_bytes(saint_old.read_bytes())
              saint_old.unlink()
          if newref not in content and oldref not in content:
              raise RuntimeError('Secret Saint reference missing from index')
          source.write_text(content.replace(oldref,newref),encoding='utf-8')
          report['tale-secret-saint']['new_path']=str(saint_new)
          report['aoashi-season-2']['verified']=True
          pathlib.Path('local_covers_report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
      - name: Validate site index syntax and editorial structure
        run: |
          node --check assets/data.js
          python scripts/editorial_audit.py > editorial_audit.log
      - name: Commit verified local cover fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/data.js assets/images/covers/tale-secret-saint.webp assets/images/covers/tale-secret-saint.jpg
          if ! git diff --cached --quiet; then
            git commit -m "fix: correct Secret Saint JPEG cover extension after image validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aninextup-local-covers-and-editorial
          path: |
            local_covers_report.json
            editorial_report.json
            editorial_audit.log
          if-no-files-found: warn
