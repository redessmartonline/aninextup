name: AniNextUp editorial audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/data.js'
      - 'assets/app.js'
      - 'assets/mobile-menu.js'
      - 'articles/**'
      - 'scripts/validate_video_schema.py'
      - 'tests/test_video_schema.py'
      - 'scripts/editorial_audit.py'
      - 'scripts/check_image_urls.py'
      - '.github/workflows/editorial-audit.yml'
jobs:
  editorial-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared site JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/mobile-menu.js
      - name: Validate Python syntax
        run: python -m py_compile scripts/editorial_audit.py
      - name: Validate video structured data
        run: |
          python -m unittest discover -s tests -p test_video_schema.py
          python scripts/validate_video_schema.py
      - name: Audit all indexed articles
        run: python scripts/editorial_audit.py > editorial_audit.log
      - name: Check external cover images
        run: python scripts/check_image_urls.py
      - name: Verify public ads.txt
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request, json
          url='https://aninextup.com/ads.txt'
          expected='google.com, pub-6586052507600375, DIRECT, f08c47fec0942fa0'
          result={'url':url,'expected':expected,'accessible':False,'contains_expected_line':False}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AniNextUp-Audit'}),timeout=20) as r:
                  body=r.read(100000).decode('utf-8','replace')
                  result.update(accessible=True,status=r.status,content_type=r.headers.get('Content-Type',''),contains_expected_line=expected in [x.strip() for x in body.splitlines()])
          except Exception as e:
              result['error']=str(e)
          with open('ads_txt_report.json','w') as out:json.dump(result,out,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - name: Print summary
        run: |
          python -c "import json; r=json.load(open('editorial_report.json')); print('Articles:',r['articles_found'],'/',r['entries'],'Warnings:',r['warning_count']); print(r['warnings_by_code'])"
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: aninextup-editorial-report
          path: |
            editorial_report.json
            editorial_audit.log
            image_url_report.json
            ads_txt_report.json
